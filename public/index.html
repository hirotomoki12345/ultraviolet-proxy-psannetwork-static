    <style>
/* 全体のスタイル */
body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

/* ヘッダー */
h1 {
    color: #ffffff;
    font-size: 2.5rem;
    margin-top: 20px;
}

/* 検索フォーム */
#uv-form {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

#uv-address {
    padding: 10px;
    font-size: 1rem;
    border-radius: 4px;
    border: 1px solid #ccc;
    background-color: #333;
    color: #fff;
    width: 300px;
}

#uv-form input[type="submit"] {
    display: none;
}

/* 検索エンジンのリスト */
ul {
    list-style-type: none;
    padding: 0;
    margin: 20px 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

li {
    display: inline-block;
}

/* ボタン */
button.selecter {
    background-color: #4CAF50;
    color: white;
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s;
    width: 150px;
    text-align: center;
}

button.selecter:hover {
    background-color: #45a049;
}

button.selecter.selected {
    background-color: #800080;
}

.AIbutton {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #431a4c;
    color: rgb(197, 170, 223);
    border: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.3s;
}

.AIbutton:hover {
    background-color: #b13a3a;
}

/* 折りたたみ機能のスタイル */
ul.collapsible {
    max-height: 200px;
    overflow: hidden;
    transition: max-height 0.5s ease-in-out;
}

ul.collapsed {
    max-height: 0;
}

/* 検索結果 */
iframe {
    display: none;
    width: 100%;
    height: 400px;
    border: none;
}

/* 中央に表示されるテキスト入力フォーム */
.centered-div {
    width: 90%;
    max-width: 400px;
    background-color: #d045c9;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
    overflow: auto;
    border-radius: 8px;
}

.container input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #333;
    color: #fff;
}

.container button {
    display: block;
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.container button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

/* ローディングインディケーター */
.loader {
    display: none;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #800080;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 2s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

    </style>
</head>
<body>
    <h1>Ultraviolet Proxy Psannetwork</h1>
    <p>Ultravioletを使ったProxyサイト</p>
    <p>検索エンジンを選択してブロックを回避して検索ができます。</p>
    <form id="uv-form" class="flex-center" onsubmit="return handleSearch(event);">
        <input id="uv-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />      
        <input id="uv-address" type="text" placeholder="Search the web freely" />
    </form>
    <ul>
        <li><button class="selecter" onclick="changesearchengine('https://www.google.com/search?q=%s');">Google</button></li>
        <li><button class="selecter" onclick="changesearchengine('https://www.bing.com/search?q=%s');">Bing</button></li>
        <li><button class="selecter" onclick="changesearchengine('https://search.yahoo.com/search?p=%s');">Yahoo</button></li>
        <li><button class="selecter" onclick="changesearchengine('https://www.startpage.com/search?query=%s');">Startpage</button></li>
        <li><button class="selecter" onclick="changesearchengine('https://duckduckgo.com/?q=%s');">DuckDuckGo</button></li>
        <li><button class="selecter" onclick="changesearchengine('https://youtube.com/results?search_query=%s');">YouTube</button></li>
    </ul>
    <iframe style="display: none;" id="uv-frame"></iframe>
    <div id="loader" class="loader"></div>
    <ul><a href="credits.html">Credit</a></ul>

    <script>
        function changesearchengine(engineUrl) {
            document.getElementById('uv-search-engine').value = engineUrl;
            const buttons = document.querySelectorAll('.selecter');
            buttons.forEach(button => {
                button.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
        }

        function handleSearch(event) {
            event.preventDefault();
            const searchEngine = document.getElementById('uv-search-engine').value;
            const query = document.getElementById('uv-address').value;
            const searchUrl = searchEngine.replace('%s', encodeURIComponent(query));
            document.getElementById('uv-frame').src = searchUrl;
        }    </script>
